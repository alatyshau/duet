# .prettierrc.yaml
#
# ЧТО: Конфигурация Prettier — автоматического форматтера кода.
# ЗАЧЕМ: Единый стиль кода для всей команды. Prettier автоматически
#        переформатирует код при сохранении — не нужно спорить о стиле.
# КТО ИСПОЛЬЗУЕТ: Prettier при `npm run format`, IDE при сохранении файлов.
#
# ДОКУМЕНТАЦИЯ: https://prettier.io/docs/en/options.html

# 'строка' вместо "строка" — короче, меньше визуального шума
singleQuote: true

# const x = 1   вместо   const x = 1;
# Точки с запятой в JS/TS опциональны, без них код чище
semi: false

# Переносить строки длиннее 100 символов
# (стандарт — 80, но 100 комфортнее для современных мониторов)
printWidth: 100

# БЕЗ висячей запятой после последнего элемента:
#   [1, 2, 3]     а не   [1, 2, 3,]
#   {a: 1, b: 2}  а не   {a: 1, b: 2,}
# Trailing comma удобна для git diff, но выглядит непривычно
trailingComma: none
