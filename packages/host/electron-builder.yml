# electron-builder.yml
#
# ЧТО: Конфигурация electron-builder для сборки и упаковки приложения.
# ЗАЧЕМ: Создаёт дистрибутивы для Windows (.exe), macOS (.dmg), Linux (.AppImage).
# КТО ИСПОЛЬЗУЕТ: electron-builder при `npm run build:mac/win/linux`.
#
# ДОКУМЕНТАЦИЯ: https://www.electron.build/configuration
#
# СТРУКТУРА ФАЙЛА:
# 1. Идентификация приложения (appId, productName)
# 2. Что включать в сборку (files, extraResources)
# 3. Платформо-специфичные секции (win, mac, linux)
# 4. Авто-обновления (publish)

# Уникальный ID приложения в формате reverse-DNS (для ОС и магазинов)
appId: org.ve68.duet
productName: Duet

directories:
  # Папка с ресурсами для сборки: иконки (icon.png, icon.ico, icon.icns),
  # entitlements для macOS, background для DMG
  buildResources: build
files:
  - package.json
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# ASAR — архивный формат Electron. Весь код упаковывается в один файл app.asar.
# asarUnpack — файлы, которые нужно ИЗВЛЕЧЬ из архива (для доступа через fs).
# Tray-иконки должны быть распакованы, иначе Electron не сможет их загрузить.
asarUnpack:
  - resources/**

# Файлы, копируемые РЯДОМ с приложением (не внутрь app.asar).
# Используются для ресурсов, к которым нужен доступ из файловой системы.
extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
  # Backend — deployed to DuetData/backend/ at runtime (atomic swap)
  - from: ../../packages/backend/
    to: backend/
    filter:
      - "**/*.py"
      - "**/requirements.txt"
      - "!**/tests/**"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
  # Platform instructions (bootstrapper + agent cores + index.json) live in
  # packages/instructions; bundle them next to backend so server.py finds them
  # as siblings (Path(__file__).parent). README.md is dev-only docs, excluded.
  - from: ../../packages/instructions/
    to: backend/
    filter:
      - "*.md"
      - "index.json"
      - "!README.md"
win:
  executableName: Duet
  icon: build/icon.ico         # Иконка для .exe и ярлыков
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false              # Показать мастер установки (не silent)
  allowToChangeInstallationDirectory: true  # Позволить выбрать папку
  runAfterFinish: true         # Предложить запустить после установки
mac:
  # identity: null пропускает code signing (для CI без сертификата)
  # При наличии Apple Developer ID — удалить эту строку
  identity: null
  # Entitlements — разрешения для macOS sandbox. Без них app не пройдёт нотаризацию.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # extendInfo — дополнительные ключи для Info.plist (манифест macOS-приложения).
  # NS*Description — обязательные строки для App Store: объясняют ЗАЧЕМ нужен доступ.
  # Без них Apple отклонит приложение. Текст показывается пользователю в системном диалоге.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # LSUIElement: true делает приложение "агентом" без иконки в Dock
    # Мы управляем этим программно, поэтому закомментировано
    # LSUIElement: true
  notarize: false
  category: public.app-category.productivity
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}

# npmRebuild: пересборка нативных модулей (C/C++ аддонов) под версию Electron.
# false — отключено, т.к. у нас нет нативных зависимостей (только JS/TS).
# Если добавите пакеты вроде sqlite3, better-sqlite3 — включите (true).
npmRebuild: false

# Конфигурация авто-обновлений через electron-updater.
# generic — простой HTTP-сервер с файлами. Альтернативы: github, s3, spaces.
# TODO: Заменить URL на реальный сервер обновлений перед production-релизом.
publish:
  provider: generic
  url: https://example.com/auto-updates
