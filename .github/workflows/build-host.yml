# build-host.yml
#
# ЧТО: GitHub Actions workflow для сборки Duet Host.
# ЗАЧЕМ: Автоматическая сборка под macOS, Windows, Linux на нативных runner'ах.
# КТО ИСПОЛЬЗУЕТ: GitHub Actions при push/PR или ручном запуске.
#
# ТРИГГЕРЫ:
# - push в main (если изменился apps/host/)
# - pull request в main (если изменился apps/host/)
# - ручной запуск (workflow_dispatch)
#
# АРТЕФАКТЫ:
# - Сохраняются на 90 дней в GitHub Actions
# - Скачать: Actions → выбрать run → Artifacts
#
# РЕЛИЗЫ:
# - Создаются вручную через GitHub UI
# - GitHub → Releases → Create new release → прикрепить файлы из Artifacts

name: Build Duet Host

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'apps/host/**'
      - '.github/workflows/build-host.yml'

  pull_request:
    branches: [main]
    paths:
      - 'apps/host/**'

jobs:
  build:
    strategy:
      fail-fast: false  # Продолжать сборку других платформ если одна упала
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Delete package-lock.json
        # package-lock.json сгенерирован на macOS и не содержит platform-specific
        # optional deps для Linux/Windows (rollup, esbuild, etc.)
        run: node -e "try{require('fs').unlinkSync('package-lock.json')}catch{}"

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        working-directory: apps/host
        run: npm run build:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Отключаем code signing для CI

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duet-host-${{ matrix.platform }}
          path: |
            apps/host/dist/*.dmg
            apps/host/dist/*.zip
            apps/host/dist/*.exe
            apps/host/dist/*.AppImage
            apps/host/dist/*.deb
            apps/host/dist/*.snap
          if-no-files-found: ignore
