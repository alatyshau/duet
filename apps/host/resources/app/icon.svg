<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент фона: индиго → фиолетовый -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Тень для глубины -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Фон: скруглённый квадрат в стиле macOS -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>

  <!-- Duet символ: два пересекающихся круга -->
  <g filter="url(#shadow)">
    <circle cx="196" cy="256" r="100" fill="white" fill-opacity="0.95"/>
    <circle cx="316" cy="256" r="100" fill="white" fill-opacity="0.95"/>
  </g>
</svg>
