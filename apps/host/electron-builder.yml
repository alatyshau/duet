# electron-builder.yml
#
# ЧТО: Конфигурация electron-builder для сборки и упаковки приложения.
# ЗАЧЕМ: Создаёт дистрибутивы для Windows (.exe), macOS (.dmg), Linux (.AppImage).
# КТО ИСПОЛЬЗУЕТ: electron-builder при `npm run build:mac/win/linux`.
#
# СЕКЦИИ:
# - appId/productName: идентификаторы приложения
# - files: что включать/исключать из сборки (! = исключить)
# - win/mac/linux: платформо-специфичные настройки
# - publish: конфигурация авто-обновлений (пока заглушка)

appId: org.ve68.duet
productName: Duet
directories:
  buildResources: build
files:
  - package.json
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Duet
  icon: build/icon.ico         # Иконка для .exe и ярлыков
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false              # Показать мастер установки (не silent)
  allowToChangeInstallationDirectory: true  # Позволить выбрать папку
  runAfterFinish: true         # Предложить запустить после установки
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # LSUIElement: true делает приложение "агентом" без иконки в Dock
    # Мы управляем этим программно, поэтому закомментировано
    # LSUIElement: true
  notarize: false
  category: public.app-category.productivity
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
